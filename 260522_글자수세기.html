<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>글자수세기</title>
</head>
<style>
    .letters_count{
        display: flex;
        flex-direction: column;
        width: 500px;
        border: 1px solid black;
        border-block: 1px solid black;
        border-radius: 10px;
        padding: 16px;
    }
    .letters_count label{
        font-size: 24px;
        margin-bottom: 16px;
    }
    .letters_count #char_area{
        font-size: 24px;
        height: 200px;
        resize: none;
        border: none;
    }
    .letters_count .blank{
        display: inline-block;
        margin-right: 8px;
        font-size: 16px;
    }
    .letters_count .blank > b{
        display: block}
</style>
<body>
    <section class="letters_count">
        <label for="char_area">글자수세기</label>
            <textarea id="char_area"></textarea>
        <div>
            <div class="blank">
                <span>공백포함</span>
                <b>111</b>
            </div>
            <div class="blank">
                <span>공백제외</span>
                <b>111</b>
            </div>
        </div>
    </section>
</body>
</html>

<script>
    let bs = document.querySelectorAll("b")
    let textarea = document.querySelector("#char_area") ///태그객체 (상자)

    textarea.oninput = () => {
        bs[0].textContent = textarea.value.length;
        bs[1].textContent = textarea.value.replaceAll(' ', '').length;
    }
