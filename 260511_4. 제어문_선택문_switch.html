<script>
    /////switch문
    //선택문인 switch문은 변수에 저장된 값과 switch문에 있는 경우의 값을 검사하여
    //변수와 경우의 값에서 일치하는 값이 있을 때 해당하는 코드 실행
    var fruits = "apple";
    switch(fruits){
        case "banana":
            console.log('banana');
            break;
        case "apple":
            console.log('apple');
            break;
        case "orange":
            console.log('orange');
            break;
        default:
            console.log('unknown fruit');
            break;
    }

/////계산이 좀 복잡하며 else if 사용하기
    var number = 90;

    if(number >= 50 && number < 90){
        console.log('못함')
    }
    else if(number >= 90){
        console.log('잘함')
    }
////////////////////////////
    var n1 = 10;
    var n2 = 20;
    var n3 = 30;

    if(n1 > n2 && n1 > n3){
        console.log('n1');
    }
    else if(n2 > n1 && n2 > n3){
        console.log('n2');
    }
    else{
        console.log('n3');
    }
    //////////////////////다른방법
    if(n1 < n2){
        if(n2 < n3){
            console.log(n3);
        }else{
            console.log(n2);
        }
    }
    else{ // n1
        if(n1 < n3){
            console.log(n3);
        }else{
            console.log(n1);
        }
    }
    ///////////////////////
    var max = n1;
    if(n1 < n2){
        max = n2;
    }
    if(max < n3){
        max = n3;
    }
    console.log(max);
    ///////////////////////////////////// (number % 2 === 0) 짝수
    var number = 21;
    if( number%2==1) {
        console.log("홀수")
    }
    else {
        console.log("짝수")
    }

</script>
