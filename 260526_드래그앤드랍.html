<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>드래그 앤 드랍</title>
</head>
<style>
    section, img{
        width: 200px;
        height: 200px;
        background-color: darkseagreen;
    }
    .s1{
        background-color: darkblue;
    }
    .s2{
        background-color: darkcyan;
    }
    .s3{
        background-color: darkkhaki;
    }
    .s4{
        background-color: darkgoldenrod;
    }
</style>
<body>
    <img src="짱구1.jpg" height="225" width="225"/>
    <section class="s1">box1</section>
    <section class="s2">box2</section>
    <section class="s3">box3</section>
    <section class="s4">box4</section>
</body>
</html>

<script>
    /// 디스트럭쳐링 문법 (TMI)

    // let img = document.querySelector('img');

    // let sec2 = sections[1];

    sec1.draggable = true; // sec1을 드래그 가능한 요소로 변경함

    s1.draggable = true;
    s2.draggable = true;
    s3.draggable = true;
    s4.draggable = true;


    // sec1.ondragstart = () => {
    //     console.log('sec1 - dragstart');
    // };
    // // 드래그 도중 sec1 안으로 마우스가 들어옴
    // sec1.ondragenter = () => {
    //     console.log('sec1 - dragenter');
    // }
    // // 드래그 도중 sec1 에서 마우스가 밖으로 나감
    // sec1.ondragleave = () => {
    //     console.log('sec1 - dragleave');
    // }
    // // img 는 원래 드래그가 가능한 요소임
    // img.ondragstart = () => {
    //     console.log('dragstart');
    // }
    // // img.ondrag = () => {
    // //     console.log('drag');
    // // }
    // img.ondragend = () => {
    //     console.log('dragend');
    // }

    // 섹션을 드래그할 때 색 변경
    // let [s1, s2, s3, s4] = document.querySelectorAll('section');
    // s1.ondragenter = (event) => {
    //     console.log('s1 - dragenter');
    //     s1.style.backgroundColor = getComputedStyle(s2).backgroundColor;
    // }

    let dragElem = null; // 현재 드래그 중인 요소를 저장해둘 변수
    let sections = document.querySelectorAll('section');
    let bgs = []; // section의 기본 배경색을 저장하는 배열
    // 처음 시작 시 section 들의 기본 배경색을 전부 가져와서 bgs에 넣기
    for(let i = 0; i < sections.length; i++){
        let c = getComputedStyle(sections[i]).backgroundColor;
        bgs.push(c);
    }
    // 모든 section에게 동일한 동작을 부여하기
    for(let i = 0; i < sections.length; i++) {
        let section = sections[i];

        section.draggable = true;
        // section ('나')가 드래그 시작했을 때
        section.ondragstart = () => {
            dragElem = section; // 현재 드래그 중인 요소를 '나'로 변경함
        }
        section.ondragend = () => {
            for(let j = 0; j < sections.length; j++) {
                sections[j].style.backgroundColor = bgs[j];
            }
        }
        // 드래그 중에 마우스가 내 안에 들어왔을 때
        section.ondragenter = () => {
            // 내 배경 색을 현재 드래그 중인 요소의 색으로 변경함
            section.style.backgroundColor = getComputedStyle(dragElem).backgroundColor;
        }
    }

</script>
