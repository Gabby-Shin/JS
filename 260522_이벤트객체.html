<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>이벤트객체</title>
</head>
<style>
    section{
        width: 200px;
        height: 200px;
        background-color: #e33f3f;
    }
    img{
        width: 200px;
        aspect-ratio: 1 / 1;
    }
    article{
        width: 300px;
        height: 300px;
        background-color: blue;
    }
    article > div{
        width: 100px;
        height: 100px;
        background-color: brown;
        position: relative;
        transform: translateX(300px);
    }
</style>
<body>
<section>
    SECTION입니다
</section>
<a href="https://www.naver.com">네이버로 이동</a>
<img src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyNjAxMzFfMzEg%2FMDAxNzY5ODM4MjA3Mzkx.ni1JyNA73UZWa7uh8qlqM6G52s_DpkzNo4RavWkNaJgg.OH6ZtvcsoutsWppbyjEMt09FA42pciCTjTSAwfkuWWAg.PNG%2Fimage.png&type=sc960_832" alt="">

<article>
    <div></div>
</article>


</body>
</html>
<script>
    let section = document.querySelector('section');
    let a = document.querySelector('a');
    let img = document.querySelector('img');
    let article = document.querySelector('article');

    a.onclick = (event) => {
        event.preventDefault(); // a태그의 클릭 기본 동작(아무것도 안햇을때 동작하는 것 (ex) a태그)을 취소한다.
        // img.style.width = '2000px';     //StopPropagation 이벤트전파를 취소함. 클리한 요소의 이벤트만 실행됨 태그안에 태그들이 있는 형태 -> 이벤트전파 (기본 버블링)
    }
    img.ondragstart = (event) =>{
        event.preventDefault();
    }

    section.onclick = (event) => {
        console.log(event);
    };

    article.onclick = () => {
        console.log('클릭됨');
    }


</script>
