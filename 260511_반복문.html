     ///while 중첩 (while 안에 while) while 먼저 끝나고 n1++실행 근데 false라서 실행안됨.
     var n1 = 0;
     var n2 = 0;
     while(n1 < 3){

         }

     }

     ///while 중첩 (while 안에 while) while 먼저 끝나고 n2 = 0이랑 n1++실행
     var n1 = 0;

     while(n1 < 3){
         while(n2 < 3){

         n1++; // n1에 1더하기
     }
