<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
    section{
        display: inline-block;
        width: 200px;
        height: 200px;
        background-color: lightblue;
    }
    article{
        display: inline-block;
        width: 300px;
        height: 300px;
        background-color: lightcoral;
    }
</style>
<body>
    <section>
        <div>DIV입니당</div>
    </section>
    <article>

    </article>

</body>
</html>

    // }
        let cloned = section.cloneNode(true);
        article.appendChild(cloned);

</script>
