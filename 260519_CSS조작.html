 <!--변수/함수/클래스 이름규칙
 변수 lowerCamelCase : 소문자로시작, 단어사이는 대문자로 myHouseIsBest
 클래스이름 UpperCamelCase : 첫글자 대문자로 시작, 단어사이는 대문자로 MyHouseIsBest
 함수이름 snake case, under score : 소문자로 시작 my_house_is_best-->
<script>
    let s1 = document.querySelector('#s1');
    s1.style.backgroundColor = '#F0A';
    s1.style.fontSize = '24px';
    // let w = s1.style.width;
    // console.log(w);

    let w = getComputedStyle(s1).width;
    let r = w.replaceAll('px', '');
    let rNum = +r;
    console.log(rNum + 100);
    s1.style.width = `${rNum + 100}px`;
    // s1.style.height = '300px';

    // s1.style.width = '300px';
</script>
