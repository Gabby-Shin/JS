<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
    span{
        display: inline-block;
        width: 0;
        border-right: 10px solid transparent;
        white-space: nowrap;
        overflow: hidden;
        animation: typing 3s steps(10, end) forwards,
                    blink 1s infinite;
    }
    @keyframes typing{
        from{width: 0}
        to{width: 100%}
    }
    @keyframes blink{
        from, to{border-color: transparent}
        50%{border-color: transparent}
    }
</style>

<body>
<main>
    <h1>Shin's Portfolio</h1>
    <span>Front End Developer</span>
</main>
</body>
</html>
